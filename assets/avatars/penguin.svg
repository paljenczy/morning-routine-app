<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Penguin -->
  <!-- Body -->
  <ellipse cx="50" cy="62" rx="28" ry="30" fill="#212121"/>
  <!-- White belly -->
  <ellipse cx="50" cy="65" rx="18" ry="22" fill="#F5F5F5"/>
  <!-- Head -->
  <circle cx="50" cy="36" r="22" fill="#212121"/>
  <!-- Face white patch -->
  <ellipse cx="50" cy="38" rx="14" ry="16" fill="#F5F5F5"/>
  <!-- Eyes -->
  <circle cx="43" cy="32" r="5" fill="white"/>
  <circle cx="57" cy="32" r="5" fill="white"/>
  <circle cx="43" cy="32" r="3" fill="#212121"/>
  <circle cx="57" cy="32" r="3" fill="#212121"/>
  <circle cx="44" cy="31" r="1" fill="white"/>
  <circle cx="58" cy="31" r="1" fill="white"/>
  <!-- Beak -->
  <polygon points="50,40 46,46 54,46" fill="#FF8F00"/>
  <!-- Wings -->
  <ellipse cx="22" cy="62" rx="10" ry="18" fill="#212121" transform="rotate(-10 22 62)"/>
  <ellipse cx="78" cy="62" rx="10" ry="18" fill="#212121" transform="rotate(10 78 62)"/>
  <!-- Feet -->
  <ellipse cx="40" cy="91" rx="10" ry="5" fill="#FF8F00"/>
  <ellipse cx="60" cy="91" rx="10" ry="5" fill="#FF8F00"/>
</svg>
