<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dog -->
  <!-- Floppy ears -->
  <ellipse cx="22" cy="52" rx="13" ry="22" fill="#BCAAA4" transform="rotate(-10 22 52)"/>
  <ellipse cx="78" cy="52" rx="13" ry="22" fill="#BCAAA4" transform="rotate(10 78 52)"/>
  <!-- Face -->
  <ellipse cx="50" cy="55" rx="28" ry="27" fill="#D7CCC8"/>
  <!-- Muzzle -->
  <ellipse cx="50" cy="68" rx="15" ry="11" fill="#EFEBE9"/>
  <!-- Eyes -->
  <ellipse cx="38" cy="50" rx="5.5" ry="6" fill="#212121"/>
  <ellipse cx="62" cy="50" rx="5.5" ry="6" fill="#212121"/>
  <circle cx="40" cy="48" r="1.5" fill="white"/>
  <circle cx="64" cy="48" r="1.5" fill="white"/>
  <!-- Nose -->
  <ellipse cx="50" cy="63" rx="5" ry="3.5" fill="#212121"/>
  <!-- Nostrils -->
  <circle cx="48" cy="63" r="1.2" fill="#424242"/>
  <circle cx="52" cy="63" r="1.2" fill="#424242"/>
  <!-- Mouth -->
  <path d="M45,67 Q50,72 55,67" stroke="#212121" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Eyebrows -->
  <path d="M33,44 Q38,41 43,44" stroke="#795548" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M57,44 Q62,41 67,44" stroke="#795548" stroke-width="2" fill="none" stroke-linecap="round"/>
